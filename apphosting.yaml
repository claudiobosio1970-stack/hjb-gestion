# Configuración de Firebase App Hosting para PRODUCCIÓN (Rama main)
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 2
  concurrency: 80

env:
  - variable: NEXT_PUBLIC_APP_ENV
    value: produccion
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: hjb--gestion-main
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: hjb--gestion-main.firebaseapp.com
